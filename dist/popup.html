<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Fox ESS Cloud V2 Controls</title>
    <style>
      body {
        width: 240px;
        padding: 12px;
        font-family: Arial;
      }
      h3 {
        margin-top: 0;
      }
      .checkbox-label {
        display: block;
        margin: 10px 0;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h3>Fox ESS Cloud V2 Controls</h3>
    <label class="checkbox-label">
      <input id="unstackCharts" type="checkbox" style="margin-right: 8px" />
      Unstack charts
    </label>
    <label class="checkbox-label">
      <input
        id="hideOpenTabs"
        type="checkbox"
        checked
        style="margin-right: 8px"
      />
      Hide dashboard bloat elements
    </label>
    <label class="checkbox-label">
      <input
        id="showSankey"
        type="checkbox"
        checked
        style="margin-right: 8px"
      />
      Show Sankey diagram
    </label>
    <div
      style="margin-top: 16px; padding-top: 12px; border-top: 1px solid #ddd"
    >
      <strong>Solar production gauge</strong>
      <label class="checkbox-label">
        <input
          id="showSolarGauge"
          type="checkbox"
          checked
          style="margin-right: 8px"
        />
        Show solar production gauge
      </label>
      <div style="margin-left: 12px">
        <label class="checkbox-label">
          <input
            id="showSolarCapacity"
            type="checkbox"
            checked
            style="margin-right: 8px"
          />
          Total capacity
        </label>
        <label class="checkbox-label">
          <input
            id="showSolarPercent"
            type="checkbox"
            checked
            style="margin-right: 8px"
          />
          Percent label
        </label>
        <label class="checkbox-label">
          <input
            id="showSolarHistory"
            type="checkbox"
            checked
            style="margin-right: 8px"
          />
          1min history graph
        </label>
      </div>
    </div>
    <div
      style="margin-top: 16px; padding-top: 12px; border-top: 1px solid #ddd"
    >
      <strong>Battery</strong>
      <label class="checkbox-label">
        <input
          id="showBatteryEstimate"
          type="checkbox"
          checked
          style="margin-right: 8px"
        />
        Show time estimate
      </label>

      <div id="batterySettings" style="margin-left: 12px">
        <div style="font-size: 14px; font-weight: bold; margin: 4px 0 6px">
          Capacity and Min SOC
        </div>
        <select
          id="batteryMode"
          aria-label="Capacity and Min SOC source"
          style="font-size: 14px; width: 100%; max-width: 190px"
        >
          <option value="auto">Auto-detect from FoxESS</option>
          <option value="manual">Enter manually</option>
        </select>

        <div id="batteryAutoPanel">
          <div
            style="
              display: grid;
              grid-template-columns: 72px 1fr;
              gap: 2px 8px;
              font-size: 14px;
              margin-top: 6px;
            "
          >
            <span style="color: #555">Capacity</span>
            <span id="detectedCapacityText">not detected yet</span>
            <span style="color: #555">Min SOC</span>
            <span id="detectedMinSocText">not detected yet</span>
          </div>
          <div
            id="batteryFreshness"
            style="font-size: 12px; color: #888; margin-top: 6px"
          ></div>
          <button
            id="refreshBatteryBtn"
            type="button"
            style="
              margin-top: 6px;
              padding: 3px 8px;
              font-size: 12px;
              cursor: pointer;
            "
          >
            Refresh from FoxESS
          </button>
          <details
            id="batteryDetails"
            style="font-size: 12px; color: #888; margin-top: 6px"
          >
            <summary style="cursor: pointer">Details</summary>
            <div
              id="batteryDetectLog"
              style="margin-top: 4px; white-space: pre-line"
            ></div>
          </details>
        </div>

        <div id="batteryManualFields" style="display: none">
          <label style="display: block; margin-top: 8px; font-size: 14px">
            <span style="display: block; margin-bottom: 4px"
              >Max Capacity (kWh)</span
            >
            <input
              id="batteryCapacityKwh"
              type="number"
              min="0"
              step="0.1"
              style="width: 90px; font-size: 14px"
            />
          </label>

          <label style="display: block; margin-top: 10px; font-size: 14px">
            <span
              style="display: block; margin-bottom: 4px"
              title="On-grid discharge floor (Battery Reserve Capacity)"
              >Min SOC (%)</span
            >
            <input
              id="minSocPercent"
              type="number"
              min="0"
              max="100"
              step="1"
              placeholder="%"
              style="width: 90px; font-size: 14px"
            />
          </label>
          <div style="font-size: 12px; color: #888; margin-top: 6px">
            Used while manual entry is selected.
          </div>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
