<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Fox ESS Cloud V2 Controls</title>
    <style>
      body {
        width: 240px;
        padding: 12px;
        font-family: Arial;
      }
      h3 {
        margin-top: 0;
      }
      .checkbox-label {
        display: block;
        margin: 10px 0;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h3>Fox ESS Cloud V2 Controls</h3>
    <label class="checkbox-label">
      <input id="unstackCharts" type="checkbox" style="margin-right: 8px" />
      Unstack charts
    </label>
    <label class="checkbox-label">
      <input
        id="hideOpenTabs"
        type="checkbox"
        checked
        style="margin-right: 8px"
      />
      Hide dashboard bloat elements
    </label>
    <label class="checkbox-label">
      <input
        id="showSankey"
        type="checkbox"
        checked
        style="margin-right: 8px"
      />
      Show Sankey diagram
    </label>
    <div
      style="margin-top: 16px; padding-top: 12px; border-top: 1px solid #ddd"
    >
      <strong>Solar production gauge</strong>
      <label class="checkbox-label">
        <input
          id="showSolarGauge"
          type="checkbox"
          checked
          style="margin-right: 8px"
        />
        Show solar production gauge
      </label>
      <div style="margin-left: 12px">
        <label class="checkbox-label">
          <input
            id="showSolarCapacity"
            type="checkbox"
            checked
            style="margin-right: 8px"
          />
          Total capacity
        </label>
        <label class="checkbox-label">
          <input
            id="showSolarPercent"
            type="checkbox"
            checked
            style="margin-right: 8px"
          />
          Percent label
        </label>
        <label class="checkbox-label">
          <input
            id="showSolarHistory"
            type="checkbox"
            checked
            style="margin-right: 8px"
          />
          1min history graph
        </label>
      </div>
    </div>
    <div
      style="margin-top: 16px; padding-top: 12px; border-top: 1px solid #ddd"
    >
      <strong>Battery estimate</strong>
      <div class="checkbox-label">
        <label>
          <input
            id="showBatteryEstimate"
            type="checkbox"
            checked
            style="margin-right: 8px"
          />
          Show battery estimate
        </label>
      </div>
      <div style="display: flex; gap: 16px; margin: 10px 0 6px">
        <label>
          <input
            id="batteryModeAuto"
            type="radio"
            name="batteryMode"
            value="auto"
            checked
            style="margin-right: 6px"
          />
          Auto-detect
        </label>
        <label>
          <input
            id="batteryModeManual"
            type="radio"
            name="batteryMode"
            value="manual"
            style="margin-right: 6px"
          />
          Manual
        </label>
      </div>
      <div
        id="batteryAutoPanel"
        style="margin-left: 12px; font-size: 12px; color: #444"
      >
        <div style="line-height: 1.7">
          Capacity:
          <span id="detectedCapacityText">not detected yet</span>
          <span id="detectedCapacityAge" style="color: #999"></span><br />
          Min SOC:
          <span id="detectedMinSocText">not detected yet</span>
          <span id="detectedMinSocAge" style="color: #999"></span>
        </div>
        <div id="batteryFreshness" style="margin-top: 4px; color: #888"></div>
        <button
          id="refreshBatteryBtn"
          type="button"
          style="
            margin-top: 8px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
          "
        >
          Refresh from FoxESS
        </button>
        <div
          id="batteryDetectLog"
          style="margin-top: 6px; color: #888; white-space: pre-line"
        ></div>
      </div>
      <div
        id="batteryManualFields"
        style="display: none; margin-left: 12px; margin-top: 8px"
      >
        <label style="display: block; margin-top: 8px">
          <span style="display: block; margin-bottom: 4px"
            >Max Capacity (kWh)</span
          >
          <input
            id="batteryCapacityKwh"
            type="number"
            min="0"
            step="0.1"
            style="width: 90px"
          />
        </label>

        <label style="display: block; margin-top: 10px">
          <span
            style="display: block; margin-bottom: 4px"
            title="On-grid discharge floor (Battery Reserve Capacity)"
            >Min SOC (%)</span
          >
          <input
            id="minSocPercent"
            type="number"
            min="0"
            max="100"
            step="1"
            placeholder="%"
            style="width: 90px"
          />
        </label>
        <div style="font-size: 11px; color: #888; margin-top: 6px">
          Used while manual mode is selected.
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
